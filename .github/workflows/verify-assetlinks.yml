name: Verify BizOn Asset Links

on:
  pull_request:
    paths:
      - '.nojekyll'
      - '.well-known/assetlinks.json'
      - 'scripts/update-bizon-assetlinks.mjs'
      - 'scripts/validate-bizon-assetlinks.mjs'
      - '.github/workflows/verify-assetlinks.yml'
      - '.github/workflows/publish-bizon-play-assetlinks.yml'
  push:
    branches: ['main']
    paths:
      - '.nojekyll'
      - '.well-known/assetlinks.json'
      - 'scripts/update-bizon-assetlinks.mjs'
      - 'scripts/validate-bizon-assetlinks.mjs'
      - '.github/workflows/verify-assetlinks.yml'
      - '.github/workflows/publish-bizon-play-assetlinks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate repository contract
        run: node scripts/validate-bizon-assetlinks.mjs

      - name: Verify deployed root endpoint
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          URL='https://thuyhuongctu.github.io/.well-known/assetlinks.json'
          for attempt in {1..24}; do
            STATUS=$(curl --silent --show-error \
              --output /tmp/assetlinks.json \
              --dump-header /tmp/headers.txt \
              --write-out '%{http_code}' \
              "$URL" || true)
            if [ "$STATUS" = '200' ]; then break; fi
            sleep 10
          done
          test "$STATUS" = '200'
          grep -qiE '^content-type:[[:space:]]*application/json' /tmp/headers.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = JSON.parse(fs.readFileSync('.well-known/assetlinks.json', 'utf8'));
          const deployed = JSON.parse(fs.readFileSync('/tmp/assetlinks.json', 'utf8'));
          const expectedFingerprints = [...expected[0].target.sha256_cert_fingerprints].sort();
          const deployedFingerprints = [...deployed[0].target.sha256_cert_fingerprints].sort();
          if (deployed[0].target.package_name !== 'vn.bizon.simulation') throw new Error('Unexpected deployed package name.');
          if (JSON.stringify(deployedFingerprints) !== JSON.stringify(expectedFingerprints)) {
            throw new Error(`Deployed fingerprints do not match repository. Expected ${expectedFingerprints.length}, received ${deployedFingerprints.length}.`);
          }
          console.log('Deployed root Digital Asset Links verified.');
          NODE
