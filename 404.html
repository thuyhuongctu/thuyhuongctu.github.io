<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đang chuyển hướng…</title>
<meta name="robots" content="noindex">
<script>
var p = location.pathname;
// Trang cá nhân: tên repo cũ JESUISHUONG_WEBSITE_2026 hoặc gõ sai hoa/thường kiểu
// /je-mappelle-huong/ → đưa về đúng /Je-mappelle-Huong/ kèm phần đường dẫn còn lại
var h = p.match(/^\/(?:JESUISHUONG_WEBSITE_2026|je-mappelle-huong)(\/.*)?$/i);
if (h) {
  location.replace('/Je-mappelle-Huong' + (h[1] || '/') + location.search + location.hash);
} else {
  // Gõ sai hoa/thường kiểu /bizon/, /Bizon/ → đưa về đúng /BizOn/ kèm phần đường dẫn còn lại
  var m = p.match(/^\/bizon(\/.*)?$/i);
  if (m) {
    location.replace('/BizOn' + (m[1] || '/') + location.search + location.hash);
  } else {
    // Mọi đường dẫn lạ khác → trang học thuật, đúng như gốc tên miền trong index.html.
    // Trước đây nhánh này đẩy tất cả về /BizOn/, nên một trang dự án tạm hỏng cũng
    // khiến khách rơi vào trò chơi kinh doanh thay vì thấy trang 404.
    location.replace('/Je-mappelle-Huong/');
  }
}
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:20vh;color:#033337">
<p>Đang chuyển đến <a href="/Je-mappelle-Huong/">Je m'appelle Hương</a> hoặc <a href="/BizOn/">BizOn Bật Nghiệp</a>…</p>
</body>
</html>
