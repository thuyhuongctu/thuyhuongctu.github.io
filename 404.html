<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang — Đỗ Thùy Hương</title>
<meta name="robots" content="noindex">
<script>
// Chỉ nắn lại đường dẫn gõ sai hoa/thường của BizOn: /bizon/, /Bizon/… → /BizOn/
// Mọi đường dẫn lạ khác KHÔNG chuyển hướng, mà hiện trang báo lỗi bên dưới.
// (Trước đây trang này đẩy hết mọi lỗi về /BizOn/, khiến một site hỏng trông
//  như là "vào nhầm trang game" thay vì báo đúng bệnh.)
(function () {
  var m = location.pathname.match(/^\/bizon(\/.*)?$/i);
  if (m && location.pathname.indexOf('/BizOn') !== 0) {
    location.replace('/BizOn' + (m[1] || '/'));
  }
})();
</script>
<style>

  body {
    margin: 0;

  }
  main { max-width: 34rem; text-align: center; }
  .code { font-size: 3.4rem; font-weight: 800; letter-spacing: -.03em; margin: 0; opacity: .35; }
  h1 { font-size: 1.35rem; margin: .2rem 0 .6rem; }
  p { margin: 0 0 1.4rem; }
  .en { font-size: .9rem; opacity: .7; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  a.card {
    display: block;
    padding: .75rem 1rem;
    border: 1px solid rgba(3, 51, 55, .18);
    border-radius: 12px;
    background: #fff;
    color: #033337;
    text-decoration: none;
    font-weight: 600;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: #0a7d75; transform: translateY(-2px); }
  a.card small { display: block; font-weight: 400; opacity: .65; }
  @media (prefers-color-scheme: dark) {
    body { background: #071a1c; color: #dceceb; }
    a.card { background: #0d2a2d; color: #dceceb; border-color: rgba(220, 236, 235, .18); }
  }
</style>
